<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <input type="text" readonly id="display" style="width: 58%; padding: 8px 10px; background-color: hsla(0, 0%, 0%, 0.5);color: white; font-size: 2rem; margin-bottom: 10px;" />
        <div id="keys" style="display:grid;grid-template-columns: auto auto auto auto; justify-content: left;">
            <button style="font-size: 2rem; width: 100px; " onclick="appendToDisplay('1')">1</button>
            <button style="font-size: 2rem; width: 100px; " onclick="appendToDisplay('2')">2</button>
            <button style="font-size: 2rem; width: 100px; " onclick="appendToDisplay('3')">3</button>
            <button style="font-size: 2rem; width: 100px; " onclick="appendToDisplay('+')">+</button>
            <button style="font-size: 2rem; width: 100px; " onclick="appendToDisplay('4')">4</button>
            <button style="font-size: 2rem; width: 100px; " onclick="appendToDisplay('5')">5</button>
            <button style="font-size: 2rem; width: 100px; " onclick="appendToDisplay('6')">6</button>
            <button style="font-size: 2rem; width: 100px; " onclick="appendToDisplay('-')">-</button>
            <button style="font-size: 2rem; width: 100px; " onclick="appendToDisplay('7')">7</button>
            <button style="font-size: 2rem; width: 100px; " onclick="appendToDisplay('8')">8</button>
            <button style="font-size: 2rem; width: 100px; " onclick="appendToDisplay('9')">9</button>
            <button style="font-size: 2rem; width: 100px; " onclick="appendToDisplay('*')">×</button>
            <button style="font-size: 2rem; width: 100px; " onclick="appendToDisplay('.')">.</button>
            <button style="font-size: 2rem; width: 100px; " onclick="appendToDisplay('0')">0</button>
            <button style="font-size: 2rem; width: 100px; " onclick="calculate()">=</button>
            <button style="font-size: 2rem; width: 100px; " onclick="appendToDisplay('/')">÷</button>
            <button style="font-size: 2rem; width: 100px; " onclick="clearDisplay()">C</button>
        </div>
    </div>




    <script>
        const display = document.getElementById("display");
        function appendToDisplay(input){

            display.value += input;
            

        }
        function clearDisplay(input){

            display.value = "";
            

        }
        function calculate(input){
            try{
                display.value = eval(display.value)
            }
            catch(error){
                display.value = "error"
            }
            
            

        }

    </script>
    
</body>
</html>
