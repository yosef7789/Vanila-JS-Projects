<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
#app{
    text-align: center;
    border: 2px solid black;
    border-radius: 10px;
    background-color: rgba(169, 169, 169, 0.3);
    margin: 20px;
    padding: 20px;
}
input,button{
    font-size: 2rem;
    padding: 5px;
}
.list{
    font-size: 2.2rem;
    background-color: rgb(192, 192, 192);
    margin: 20px;
}
.check{
    text-decoration: line-through;
}
.btn{
    font-size: 1.5rem;
    padding: 1px;
    margin-left: 20px;
}
</style>
<body>
    <div id="app">
        <h1>TO DO LIST</h1>
        <form action="" class="form">
            <input type="text" class="input">
            <button type="submit" >Add</button>
        </form>
        <div>
            <ol class="orderlist">
            </ol>
        </div>        
    </div>





    <script>

        const input = document.querySelector(".input");
        const orderList = document.querySelector(".orderlist");
        const form = document.querySelector(".form");


        form.addEventListener("submit",(event)=> {
            event.preventDefault();
            const task = input.value;
            addTask(task);
        })


        function addTask(task){

            if(task !== ""){

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.classList.add("btn");

                const newTask = document.createElement("li");
                newTask.textContent = task;
                newTask.classList.add("list");

                const button = document.createElement("button");
                button.textContent = "✖️";
                button.classList.add("btn");

                const moveUp = document.createElement("button");
                moveUp.textContent = "⬆️";
                moveUp.classList.add("btn");

                const moveDown = document.createElement("button");
                moveDown.textContent = "⬇️"
                moveDown.classList.add("btn");


                newTask.appendChild(checkbox);
                newTask.appendChild(button);
                newTask.appendChild(moveUp);
                newTask.appendChild(moveDown);
                orderList.appendChild(newTask);


                checkbox.addEventListener("click",()=>{
                    newTask.classList.toggle("check");
                });

                button.addEventListener("click",()=>{
                    newTask.remove();
                });
                
                moveUp.addEventListener("click",()=>{
                    const previous = newTask.previousElementSibling;
                    if(previous != null){
                        orderList.insertBefore(newTask,previous);
                    } 
                });

                moveDown.addEventListener("click",()=>{
                    const after = newTask.nextElementSibling;
                    orderList.insertBefore(after,newTask); 
                });

                input.value = "";
                

            }
        
        }

    </script>
</body>
</html>
